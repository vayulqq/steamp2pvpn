name: Build Steam P2P VPN

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Настройка окружения MSVC (x64)
    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Установка GLFW через vcpkg (который предустановлен на windows-latest)
    - name: Install GLFW via Vcpkg
      run: |
        vcpkg install glfw3:x64-windows

    # Автоматическое скачивание wintun.dll прямо в ходе сборки
    - name: Download Wintun DLL
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
        Expand-Archive -Path "wintun.zip" -DestinationPath "wintun-sdk"
        Copy-Item -Path "wintun-sdk/wintun/bin/amd64/wintun.dll" -Destination "."

    # Конфигурация CMake с подключением vcpkg toolchain
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET="x64-windows"

    # Сборка проекта в режиме Release
    - name: Build Project
      run: |
        cmake --build build --config Release

    # Подготовка директории с готовым релизным комплектом
    - name: Prepare Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Копируем .exe файл
        if (Test-Path "build/Release/SteamP2PVPN.exe") {
            Copy-Item "build/Release/SteamP2PVPN.exe" "dist/"
        } elseif (Test-Path "build/SteamP2PVPN.exe") {
            Copy-Item "build/SteamP2PVPN.exe" "dist/"
        }
        
        # Копируем DLL-библиотеки и конфиг
        if (Test-Path "build/Release/steam_api64.dll") {
            Copy-Item "build/Release/steam_api64.dll" "dist/"
        } elseif (Test-Path "build/steam_api64.dll") {
            Copy-Item "build/steam_api64.dll" "dist/"
        }
        
        Copy-Item "wintun.dll" "dist/"
        
        if (Test-Path "steam_appid.txt") {
            Copy-Item "steam_appid.txt" "dist/"
        } else {
            "480" | Out-File -FilePath "dist/steam_appid.txt" -Encoding ascii
        }

    # Загрузка собранного комплекта в Artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamP2PVPN-Windows-x64
        path: dist/
