name: Build Steam P2P VPN

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Настройка окружения MSVC (x64)
    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Установка GLFW через vcpkg
    - name: Install GLFW via Vcpkg
      run: |
        vcpkg install glfw3:x64-windows-static-md

    # Автоматическое скачивание wintun.dll
    - name: Download Wintun DLL
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
        Expand-Archive -Path "wintun.zip" -DestinationPath "wintun-sdk"
        Copy-Item -Path "wintun-sdk/wintun/bin/amd64/wintun.dll" -Destination "."

    # Конфигурация CMake с оптимизациями
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET="x64-windows-static-md"

    # Сборка проекта в режиме Release
    - name: Build Project
      run: |
        cmake --build build --config Release

    # Создание временного сертификата и подпись бинарника (Code Signing)
    - name: Code Sign Executable
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -CertStoreLocation cert:\CurrentUser\My -Subject "CN=SteamP2PVPN" -Type CodeSigningCert
        $exePath = "build/Release/SteamP2PVPN.exe"
        if (-not (Test-Path $exePath)) { $exePath = "build/SteamP2PVPN.exe" }
        
        # Подписываем утилитой signtool из Windows SDK
        $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
        if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
        }
        & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $exePath

    # Подготовка директории с готовым релизным комплектом
    - name: Prepare Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        if (Test-Path "build/Release/SteamP2PVPN.exe") {
            Copy-Item "build/Release/SteamP2PVPN.exe" "dist/"
        } elseif (Test-Path "build/SteamP2PVPN.exe") {
            Copy-Item "build/SteamP2PVPN.exe" "dist/"
        }
        
        if (Test-Path "build/Release/steam_api64.dll") {
            Copy-Item "build/Release/steam_api64.dll" "dist/"
        } elseif (Test-Path "build/steam_api64.dll") {
            Copy-Item "build/steam_api64.dll" "dist/"
        }
        
        Copy-Item "wintun.dll" "dist/"
        
        if (Test-Path "steam_appid.txt") {
            Copy-Item "steam_appid.txt" "dist/"
        } else {
            "480" | Out-File -FilePath "dist/steam_appid.txt" -Encoding ascii
        }

    # Загрузка собранного комплекта в Artifacts
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SteamP2PVPN-Windows-x64
        path: dist/
